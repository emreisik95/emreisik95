<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Emre Ashak — Senior Backend Engineer</title>
  <desc id="description">A dark systems diagram introducing Emre Ashak, a senior backend engineer focused on Go, TypeScript, distributed systems, and cloud infrastructure.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100F"/>
      <stop offset="0.58" stop-color="#0A1214"/>
      <stop offset="1" stop-color="#0D1518"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.79" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.13"/>
      <stop offset="0.48" stop-color="#4ADE80" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#4ADE80" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8AA0A6" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1280" height="420" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#background)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
    <path d="M0 1H1280" stroke="#E6EDF0" stroke-opacity="0.12"/>
    <path d="M0 419H1280" stroke="#E6EDF0" stroke-opacity="0.08"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <circle cx="72" cy="58" r="4" fill="#4ADE80" filter="url(#softGlow)"/>
      <text x="88" y="63" fill="#86EFAC" font-size="12" font-weight="700" letter-spacing="3">BACKEND · PLATFORM · PRODUCT</text>
      <text x="70" y="172" fill="#F4F7F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="750" letter-spacing="-2.5">EMRE ASHAK</text>
      <text x="73" y="218" fill="#A9B8BB" font-size="20" font-weight="600" letter-spacing="3.5">SENIOR BACKEND ENGINEER</text>

      <rect x="70" y="258" width="554" height="1" fill="url(#accentLine)"/>
      <text x="70" y="300" fill="#D3DCDE" font-size="13" font-weight="600" letter-spacing="1.15">GO  /  TYPESCRIPT  /  DISTRIBUTED SYSTEMS  /  CLOUD</text>

      <rect x="70" y="336" width="9" height="9" rx="2" fill="#4ADE80"/>
      <text x="94" y="346" fill="#8AA0A6" font-size="12" letter-spacing="1.35">EU WORK AUTHORIZED · REMOTE + RELOCATION</text>
      <text x="70" y="385" fill="#53666B" font-size="10" letter-spacing="2.1">BUILDING RELIABLE SYSTEMS FROM MUĞLA · UTC+3</text>
