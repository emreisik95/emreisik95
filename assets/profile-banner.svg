        <text x="0" y="83" fill="#86EFAC" font-size="10" text-anchor="middle" letter-spacing="2">CORE</text>
      </g>

      <g transform="translate(758 94)">
        <rect width="96" height="62" rx="10" fill="#0D1918" stroke="#8AA0A6" stroke-opacity="0.28"/>
        <circle cx="18" cy="18" r="4" fill="#4ADE80"/>
        <text x="16" y="42" fill="#D3DCDE" font-size="11" font-weight="700" letter-spacing="1.4">API</text>
      </g>

      <g transform="translate(1095 88)">
        <rect width="108" height="62" rx="10" fill="#0D1918" stroke="#8AA0A6" stroke-opacity="0.28"/>
        <path d="M16 17H35M16 23H31M16 29H27" stroke="#4ADE80" stroke-width="1.5"/>
        <text x="16" y="47" fill="#D3DCDE" font-size="11" font-weight="700" letter-spacing="1.4">QUEUE</text>
      </g>

      <g transform="translate(1136 264)">
