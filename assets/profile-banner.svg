        <ellipse cx="26" cy="16" rx="11" ry="4" fill="none" stroke="#4ADE80" stroke-width="1.4"/>
        <path d="M15 16V29C15 34 37 34 37 29V16M15 23C15 28 37 28 37 23" fill="none" stroke="#4ADE80" stroke-width="1.4"/>
        <text x="16" y="49" fill="#D3DCDE" font-size="11" font-weight="700" letter-spacing="1.3">STORE</text>
      </g>

      <text x="748" y="390" fill="#53666B" font-size="9" letter-spacing="1.7">DESIGNED FOR FAILURE · BUILT FOR CLARITY</text>
      <text x="1198" y="390" fill="#53666B" font-size="9" text-anchor="end">01 / 01</text>
    </g>
