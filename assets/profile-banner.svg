      <text x="748" y="63" fill="#53666B" font-size="10" letter-spacing="2">SYSTEM MAP / 01</text>
      <text x="1158" y="63" fill="#4ADE80" font-size="10" letter-spacing="1.4">ONLINE</text>

      <g fill="none" stroke="#4ADE80" stroke-opacity="0.34" stroke-width="1.2">
        <path d="M818 125 C875 125 881 183 945 198"/>
        <path d="M1137 119 C1085 126 1085 176 1039 196"/>
        <path d="M1030 247 C1076 273 1104 292 1155 292"/>
        <path d="M978 251 C956 282 937 300 901 319"/>
        <path d="M818 125 C866 184 835 276 878 319" stroke-dasharray="4 8"/>
        <path d="M1137 119 C1168 162 1184 220 1176 273" stroke-dasharray="4 8"/>
      </g>

      <g fill="#4ADE80" filter="url(#softGlow)">
