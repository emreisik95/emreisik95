        <path d="M16 16H33V31H16Z" fill="none" stroke="#4ADE80" stroke-width="1.4"/>
        <path d="M20 20L24.5 24.5 31 18" fill="none" stroke="#86EFAC" stroke-width="1.4"/>
        <text x="16" y="48" fill="#D3DCDE" font-size="11" font-weight="700" letter-spacing="1.1">WORKER</text>
      </g>

      <g transform="translate(827 304)">
