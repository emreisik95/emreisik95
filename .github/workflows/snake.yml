name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: emreisik95
          outputs: |
            dist/snake.svg?color_snake=#4ADE80&color_dots=#0B0F10,#2F9E5B,#4ADE80,#86EFAC,#DCFCE7
            dist/snake-dark.svg?color_snake=#4ADE80&color_dots=#0B0F10,#173A26,#2F9E5B,#4ADE80,#86EFAC

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
